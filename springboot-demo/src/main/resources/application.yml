server:
  port: 28080

spring:
  redis:
    host: localhost
    port: 6379
    password: ENC(xvbQ57E/87qvbbmNI8A1OKZGVIISBy/X0yWTYb3YVfSt0FtRGZ+pp+XpfdMra6dP)
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        enabled: false  # 关闭连接池

jasypt:
  encryptor:
    # 使用自定义加密器
    bean: codeSheepEncryptorBean
    # 安全考虑，加密密钥不要写在配置中 java -jar xx.jar --jasypt.encryptor.password=CodeSheep
    # java -Djasypt.encryptor.password=CodeSheep -jar xx.jar
    password: CodeSheep

rocketmq:
  enhance:
    # 启动隔离，用于激活配置类EnvironmentIsolationConfig
    # 启动后会自动在topic上拼接激活的配置文件，达到自动隔离的效果
    enabledIsolation: true
    # 隔离环境名称，拼接到topic后，topic_dev，默认空字符串
    environment: dev
  name-server: 192.168.1.224:9876 # 访问地址
  consumer:
    group: springboot_consumer_group
      # 一次拉取消息最大值，注意是拉取消息的最大值而非消费最大值
    pull-batch-size: 10
  producer:
    group: Pro_Group  # 生产者组
    sendMessageTimeout: 3000 # 消息发送超时时长，默认3s
    retryTimesWhenSendFailed: 3 # 同步发送消息失败重试次数，默认2
    retryTimesWhenSendAsyncFailed: 3 # 异步发送消息失败重试次数，默认2
    # 消息最大长度，默认1024 * 1024 * 4(默认4M)
    maxMessageSize: 4096
    # 压缩消息阈值，默认4k(1024 * 4)
    compressMessageBodyThreshold: 4096
    # 是否在内部发送失败时重试另一个broker，默认false
    retryNextServer: false


